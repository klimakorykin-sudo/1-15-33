<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Послание Ане</title>
    <link rel="stylesheet" href="/1-15-33/app/styles/variables.css">
    <link rel="stylesheet" href="/1-15-33/app/styles/global.css">
    <link rel="stylesheet" href="/1-15-33/app/styles/dark-mode.css">
    <link rel="stylesheet" href="message.css">
</head>
<body>
    <main class="message">
        <div class="message-envelope" id="messageEnvelope">
            <div class="message-envelope-back"></div>
            <div class="message-envelope-front" id="messageEnvelopeFront">
                <span class="message-envelope-icon">💌</span>
                <p class="message-envelope-text handwritten">нажми, чтобы открыть</p>
            </div>
            <div class="message-letter" id="messageLetter">
                <p class="message-letter-text handwritten" id="messageLetterText"></p>
            </div>
        </div>
        
        <a href="#/" class="message-back handwritten">← назад</a>
    </main>
</body>
</html>
